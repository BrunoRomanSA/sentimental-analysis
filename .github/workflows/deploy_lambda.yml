name: Deploy IMDB Lambda

on:
  push:
    branches:
      - develop


permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO_NAME: imdb-lambda-repo
  TF_STATE_BUCKET: 503561450616-statefile-terraform
  TF_STATE_KEY: imdb-lambda/terraform.tfstate
  GITHUB_ROLE: arn:aws:iam::503561450616:role/role-github-terraform-build

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configura AWS via OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.GITHUB_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # 4️⃣ Setup Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 5️⃣ Login no ECR
      - name: Login to Amazon ECR
        id: login-ecr
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin 503561450616.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Create ECR repository if not exists
        run: |
          if ! aws ecr describe-repositories --repository-names $ECR_REPO_NAME >/dev/null 2>&1; then
            echo "Repository does not exist. Creating..."
            aws ecr create-repository --repository-name $ECR_REPO_NAME
          else
            echo "Repository already exists."
          fi

          # Adicionar policy para permitir Lambda puxar imagens
          aws ecr set-repository-policy \
            --repository-name $ECR_REPO_NAME \
            --policy-text '{
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "LambdaECRImageRetrievalPolicy",
                  "Effect": "Allow",
                  "Principal": {
                    "Service": "lambda.amazonaws.com"
                  },
                  "Action": [
                    "ecr:BatchGetImage",
                    "ecr:GetDownloadUrlForLayer"
                  ]
                }
              ]
            }'

      # 7️⃣ Build e push do container
      - name: Build and push Docker image
        id: build-image
        run: |
          IMAGE_URI=503561450616.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO_NAME:latest
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "Building Docker image $IMAGE_URI..."
          docker build -t $IMAGE_URI .
          echo "Pushing Docker image $IMAGE_URI to ECR..."
          docker push $IMAGE_URI

  setup-infra:
    uses: ./.github/workflows/terraform.yml
    needs: deploy
    with:
      environment: dev
      aws-assume-role-arn: arn:aws:iam::503561450616:role/role-github-terraform-build
      aws-statefile-s3-bucket: 503561450616-statefile-terraform
      aws-lock-dynamodb-table: 503561450616-terraform-lock
      aws-region: us-east-1
