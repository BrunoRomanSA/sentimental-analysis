name: "Terraform Workflow"

on: 
  workflow_call: 
    inputs:
      environment:
        type: string
        required: true
      aws-assume-role-arn:
        type: string
        required: true
      aws-statefile-s3-bucket:
        type: string
        required: true
      aws-lock-dynamodb-table:
        type: string
        required: true
      aws-region:
        type: string
        required: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ inputs.aws-assume-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Initialize
        run: |
          cd infra && terraform init \
            -backend-config="bucket=${{ inputs.aws-statefile-s3-bucket }}" \
            -backend-config="key=${{ github.event.repository.name }}" \
            -backend-config="region=${{ inputs.aws-region }}" \
            -backend-config="dynamodb_table=${{ inputs.aws-lock-dynamodb-table }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform destroy
        # if: steps.read-destroy-json.outputs.destroy == 'true'
        id: terraform-destroy
        run: |
          cd infra
          terraform workspace select -or-create ${{ inputs.environment }}
          terraform destroy -var-file="./${{ inputs.environment }}/terraform.tfvars" -auto-approve

      
      # - name: Terraform Plan
      #   if: steps.read-destroy-json.outputs.destroy != 'true'
      #   id: terraform-plan
      #   run: |
      #     cd infra
      #     terraform workspace select -or-create ${{ inputs.environment }}
      #     terraform plan -var-file="./${{ inputs.environment }}/terraform.tfvars" -out="${{ inputs.environment }}.plan"



      # - name: Terraform Apply
      #   if: steps.read-destroy-json.outputs.destroy != 'true'
      #   id: terraform-apply
      #   run: |
      #     cd infra
      #     terraform workspace select -or-create ${{ inputs.environment }}
      #     terraform apply "${{ inputs.environment }}.plan"


      - name: End Workflow if Destroy
        # if: steps.read-destroy-json.outputs.destroy == 'true'
        run: |
          echo "Destroy operation detected. Exiting workflow."
          exit 0